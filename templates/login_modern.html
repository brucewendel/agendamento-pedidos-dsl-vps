<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Login - DSL Agendamento</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DSL Agendamento">
    <meta name="description" content="Sistema de Gestão de Agendamentos e Entregas DSL">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- PWA Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/icon-192x192.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192x192.png') }}">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- UX Improvements -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ux-improvements.css') }}">
    <script src="{{ url_for('static', filename='js/ux-enhancements.js') }}"></script>
    
    <style>
        @keyframes animate-fade-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: animate-fade-in 0.5s ease-out;
        }
    </style>
</head>
<body x-data="{ darkMode: false }" :class="{ 'dark': darkMode }" id="appBody">
<div class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-slate-100 dark:from-slate-900 dark:via-blue-950 dark:to-slate-900 flex items-center justify-center p-4 relative overflow-hidden">
    
    <!-- Background Pattern -->
    <div class="absolute inset-0 opacity-10">
        <div class="absolute inset-0" style="background-image: radial-gradient(circle at 1px 1px, rgb(148 163 184) 1px, transparent 0); background-size: 40px 40px;"></div>
    </div>
    
    <!-- Login Card -->
    <div class="relative z-10 w-full max-w-md" x-data="loginForm()">
        
        <!-- Card Container -->
        <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden animate-fade-in">
            
            <!-- Header with Gradient -->
            <div class="bg-gradient-to-r from-blue-600 to-blue-700 p-8 text-center">
                <div class="w-20 h-20 mx-auto mb-4 bg-white/20 backdrop-blur-sm rounded-2xl flex items-center justify-center">
                    <i class="bi bi-calendar-check text-4xl text-white"></i>
                </div>
                <h1 class="text-3xl font-bold text-white mb-2">DSL Agendamento</h1>
                <p class="text-blue-100">Sistema de Gestão de Entregas</p>
            </div>
            
            <!-- Form Content -->
            <div class="p-8">
                
                <!-- Error Message -->
                {% if error %}
                <div class="mb-6 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-xl p-4 flex items-start gap-3 animate-fade-in">
                    <i class="bi bi-exclamation-circle-fill text-red-500 text-xl flex-shrink-0 mt-0.5"></i>
                    <div>
                        <p class="font-semibold text-red-800 dark:text-red-200">Erro de autenticação</p>
                        <p class="text-sm text-red-600 dark:text-red-300">{{ error }}</p>
                    </div>
                </div>
                {% endif %}
                
                <!-- Login Form -->
                <form method="POST" @submit.prevent="submitForm" class="space-y-6">
                    
                    <!-- Username Field -->
                    <div>
                        <label for="username" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">
                            <i class="bi bi-person-fill mr-1"></i> Usuário
                        </label>
                        <div class="relative">
                            <input 
                                type="text" 
                                id="username" 
                                name="username" 
                                x-model="username"
                                required
                                class="w-full px-4 py-3 pl-12 bg-slate-50 dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-700 rounded-xl focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition-all duration-200 text-slate-900 dark:text-slate-100"
                                placeholder="Digite seu usuário"
                                :class="{ 'border-red-500': errors.username }"
                            >
                            <i class="bi bi-person absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        </div>
                        <p x-show="errors.username" x-text="errors.username" class="mt-1 text-sm text-red-500"></p>
                    </div>
                    
                    <!-- Password Field -->
                    <div>
                        <label for="password" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">
                            <i class="bi bi-lock-fill mr-1"></i> Senha
                        </label>
                        <div class="relative">
                            <input 
                                :type="showPassword ? 'text' : 'password'" 
                                id="password" 
                                name="password" 
                                x-model="password"
                                required
                                class="w-full px-4 py-3 pl-12 pr-12 bg-slate-50 dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-700 rounded-xl focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition-all duration-200 text-slate-900 dark:text-slate-100"
                                placeholder="Digite sua senha"
                                :class="{ 'border-red-500': errors.password }"
                            >
                            <i class="bi bi-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <button 
                                type="button" 
                                @click="showPassword = !showPassword"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors"
                            >
                                <i :class="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                            </button>
                        </div>
                        <p x-show="errors.password" x-text="errors.password" class="mt-1 text-sm text-red-500"></p>
                    </div>
                    
                    <!-- Remember Me -->
                    <div class="flex items-center justify-between">
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input 
                                type="checkbox" 
                                x-model="rememberMe"
                                class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-2 focus:ring-blue-500/20 cursor-pointer"
                            >
                            <span class="text-sm text-slate-600 dark:text-slate-400 group-hover:text-slate-900 dark:group-hover:text-slate-200 transition-colors">
                                Lembrar-me
                            </span>
                        </label>
                    </div>
                    
                    <!-- Submit Button -->
                    <button 
                        type="submit" 
                        :disabled="loading"
                        class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-bold py-4 px-6 rounded-xl shadow-lg shadow-blue-500/30 hover:shadow-xl hover:shadow-blue-500/40 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                    >
                        <span x-show="!loading">
                            <i class="bi bi-box-arrow-in-right"></i> Entrar
                        </span>
                        <span x-show="loading" class="flex items-center gap-2">
                            <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                            Entrando...
                        </span>
                    </button>
                </form>
                
                <!-- Divider -->
                <div class="relative my-8">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-200 dark:border-slate-700"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400">ou</span>
                    </div>
                </div>
                
                <!-- RCA Login Link -->
                <a 
                    href="/login-rca" 
                    class="block w-full bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-semibold py-4 px-6 rounded-xl transition-all duration-200 text-center"
                >
                    <i class="bi bi-phone"></i> Login RCA via WhatsApp
                </a>
                
            </div>
            
            <!-- Footer -->
            <div class="bg-slate-50 dark:bg-slate-900/50 px-8 py-4 border-t border-slate-200 dark:border-slate-700">
                <div class="flex items-center justify-between text-sm text-slate-500 dark:text-slate-400">
                    <span>© Desenvolvido por Tecnologia DSL</span>
                    <button 
                        @click="darkMode = !darkMode"
                        onclick="toggleTheme()"
                        class="p-2 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg transition-colors"
                        title="Alternar tema"
                        id="themeToggle"
                    >
                        <i :class="darkMode ? 'bi-sun-fill' : 'bi-moon-fill'" id="themeIcon" class="bi-moon-fill"></i>
                    </button>
                </div>
            </div>
            
        </div>
        
        <!-- PWA Install Section -->
        <div class="mt-6 text-center space-y-3" x-show="showInstallButton">
            <p class="text-sm text-slate-600 dark:text-slate-400">
                <i class="bi bi-download"></i> 
                Clique para instalar o aplicativo
            </p>
            <button 
                @click="installPWA"
                class="inline-flex items-center gap-2 px-6 py-2.5 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-lg hover:from-blue-700 hover:to-purple-700 transition-all duration-200 text-sm font-semibold shadow-lg hover:shadow-xl transform hover:scale-105"
            >
                <i class="bi bi-download"></i>
                <span>Instalar Aplicativo</span>
            </button>
        </div>
        
        <!-- Loading PWA Message -->
        <div class="mt-6 text-center" x-show="!showInstallButton && !isPWAInstalled()">
            <p class="text-xs text-slate-500 dark:text-slate-400">
                <i class="bi bi-hourglass-split"></i> 
                Preparando instalação do aplicativo...
            </p>
        </div>
        
    </div>
</div>

<script>
function loginForm() {
    return {
        username: '',
        password: '',
        showPassword: false,
        rememberMe: false,
        loading: false,
        errors: {},
        showInstallButton: false,
        deferredPrompt: null,
        
        async submitForm() {
            this.errors = {};
            
            // Validação básica
            if (!this.username.trim()) {
                this.errors.username = 'Usuário é obrigatório';
                return;
            }
            
            if (!this.password.trim()) {
                this.errors.password = 'Senha é obrigatória';
                return;
            }
            
            this.loading = true;
            
            try {
                const formData = new FormData();
                formData.append('username', this.username.trim());
                formData.append('password', this.password.trim());
                
                // Adicionar token CSRF (com verificação)
                const csrfMeta = document.querySelector('meta[name="csrf-token"]');
                if (csrfMeta) {
                    const csrfToken = csrfMeta.getAttribute('content');
                    if (csrfToken) {
                        formData.append('csrf_token', csrfToken);
                        console.log('✅ CSRF token adicionado ao FormData');
                    } else {
                        console.warn('⚠️ Meta tag csrf-token existe mas está vazia');
                    }
                } else {
                    console.error('❌ Meta tag csrf-token não encontrada no HTML');
                }
                
                console.log('📤 Enviando requisição para /login-modern...');
                const response = await fetch('/login-modern', {
                    method: 'POST',
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                        'Accept': 'application/json'
                    },
                    credentials: 'include',  // Envia cookies (sessão + CSRF)
                    body: formData
                });
                
                console.log(`📥 Resposta recebida: ${response.status} ${response.statusText}`);
                
                if (response.ok) {
                    // Salvar credenciais se "lembrar-me" estiver marcado
                    if (this.rememberMe) {
                        localStorage.setItem('remembered_username', this.username);
                    }
                    
                    // Redirecionar
                    window.location.href = '/painel';
                } else {
                    const data = await response.json();
                    Swal.fire({
                        icon: 'error',
                        title: 'Erro de autenticação',
                        text: data.message || 'Credenciais inválidas',
                        confirmButtonColor: '#ef4444'
                    });
                }
            } catch (error) {
                console.error('Erro no login:', error);
                
                if (!navigator.onLine) {
                    Swal.fire({
                        icon: 'warning',
                        title: 'Você está offline',
                        text: 'Não é possível fazer login sem conexão com a internet.',
                        confirmButtonColor: '#f59e0b'
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Erro',
                        text: 'Ocorreu um erro ao tentar fazer login. Tente novamente.',
                        confirmButtonColor: '#ef4444'
                    });
                }
            } finally {
                this.loading = false;
            }
        },
        
        async installPWA() {
            // Verificar se já está instalado
            if (this.isPWAInstalled()) {
                Swal.fire({
                    icon: 'success',
                    title: 'App Já Instalado!',
                    text: 'O DSL Agendamento já está instalado no seu dispositivo.',
                    confirmButtonColor: '#10b981'
                });
                return;
            }
            
            // Se tem prompt disponível (Chrome/Edge) - INSTALAÇÃO AUTOMÁTICA
            if (this.deferredPrompt) {
                try {
                    // Mostrar prompt de instalação do navegador
                    this.deferredPrompt.prompt();
                    
                    // Aguardar escolha do usuário
                    const { outcome } = await this.deferredPrompt.userChoice;
                    
                    if (outcome === 'accepted') {
                        Swal.fire({
                            icon: 'success',
                            title: 'App Instalado!',
                            text: 'O DSL Agendamento foi instalado com sucesso.',
                            confirmButtonColor: '#10b981',
                            timer: 3000,
                            showConfirmButton: false
                        });
                    }
                    
                    this.deferredPrompt = null;
                } catch (error) {
                    console.error('Erro ao instalar PWA:', error);
                    Swal.fire({
                        icon: 'error',
                        title: 'Erro na Instalação',
                        text: 'Ocorreu um erro ao tentar instalar o aplicativo. Tente novamente.',
                        confirmButtonColor: '#ef4444'
                    });
                }
                return;
            }
            
            // Se não tem prompt disponível - Mostrar instruções manuais
            const isAndroid = /Android/i.test(navigator.userAgent);
            const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
            const isChrome = /Chrome/i.test(navigator.userAgent) && !/Edg/i.test(navigator.userAgent);
            const isEdge = /Edg/i.test(navigator.userAgent);
            
            let instructions = '';
            
            if (isAndroid && isChrome) {
                instructions = '<div style="text-align: left; padding: 10px;"><strong>📱 Como instalar no Android (Chrome):</strong><br><br>1. Toque no menu <strong>⋮</strong> (três pontos) no canto superior direito<br>2. Selecione <strong>"Adicionar à tela inicial"</strong> ou <strong>"Instalar app"</strong><br>3. Confirme tocando em <strong>"Adicionar"</strong><br><br>O ícone do app aparecerá na sua tela inicial! 🎉</div>';
            } else if (isIOS) {
                instructions = '<div style="text-align: left; padding: 10px;"><strong>📱 Como instalar no iPhone/iPad (Safari):</strong><br><br>1. Toque no botão <strong>Compartilhar</strong> <svg style="display: inline; width: 16px; height: 16px;" viewBox="0 0 16 16"><path fill="currentColor" d="M8 0l3 3h-2v5H7V3H5l3-3zm3 8v5H5V8H3v7h10V8h-2z"/></svg><br>2. Role para baixo e toque em <strong>"Adicionar à Tela de Início"</strong><br>3. Toque em <strong>"Adicionar"</strong> no canto superior direito<br><br>O ícone do app aparecerá na sua tela inicial! 🎉</div>';
            } else if (isChrome || isEdge) {
                instructions = '<div style="text-align: left; padding: 10px;"><strong>💻 Como instalar no Desktop:</strong><br><br>1. Procure o ícone <strong>⊕</strong> ou <strong>🖥️</strong> na barra de endereço<br>2. Clique nele e selecione <strong>"Instalar"</strong><br><br><strong>OU</strong><br><br>1. Clique no menu <strong>⋮</strong> (três pontos)<br>2. Selecione <strong>"Instalar DSL Agendamento"</strong><br><br>O app será instalado no seu computador! 🎉</div>';
            } else {
                instructions = '<div style="text-align: left; padding: 10px;"><strong>ℹ️ Instalação Manual:</strong><br><br>Para instalar este aplicativo:<br><br>1. Use o navegador <strong>Chrome</strong>, <strong>Edge</strong> ou <strong>Safari</strong><br>2. Procure a opção de <strong>"Adicionar à tela inicial"</strong> ou <strong>"Instalar app"</strong> no menu do navegador<br>3. Siga as instruções na tela<br><br>💡 <strong>Dica:</strong> Acesse via <strong>https://</strong> ou <strong>localhost</strong> para instalação automática.</div>';
            }
            
            Swal.fire({
                icon: 'info',
                title: 'Como Instalar o App',
                html: instructions,
                confirmButtonText: 'Entendi',
                confirmButtonColor: '#3b82f6',
                width: '500px'
            });
        },
        
        isPWAInstalled() {
            return window.matchMedia('(display-mode: standalone)').matches || 
                   window.navigator.standalone === true;
        },
        
        init() {
            // Carregar usuário lembrado
            const remembered = localStorage.getItem('remembered_username');
            if (remembered) {
                this.username = remembered;
                this.rememberMe = true;
            }
            
            console.log('🔍 Iniciando detecção PWA...');
            console.log('📍 URL atual:', window.location.href);
            console.log('🔒 Protocolo:', window.location.protocol);
            
            // Verificar se já está instalado
            if (this.isPWAInstalled()) {
                console.log('✅ PWA já está instalado');
                this.showInstallButton = false;
                return;
            }
            
            // Capturar evento de instalação PWA
            window.addEventListener('beforeinstallprompt', (e) => {
                console.log('🎯 Evento beforeinstallprompt capturado!');
                e.preventDefault();
                this.deferredPrompt = e;
                this.showInstallButton = true;
            });
            
            // Esconder botão após instalação
            window.addEventListener('appinstalled', () => {
                console.log('✅ PWA instalado com sucesso!');
                this.showInstallButton = false;
                this.deferredPrompt = null;
            });
            
            // Timeout para mostrar botão se evento não disparar (para teste)
            setTimeout(() => {
                if (!this.deferredPrompt && !this.isPWAInstalled()) {
                    console.log('⚠️ Evento beforeinstallprompt não foi disparado');
                    console.log('💡 Acesse via https:// ou localhost para instalação automática');
                    // Mostrar botão mesmo assim para permitir teste manual
                    this.showInstallButton = true;
                }
            }, 5000);
        }
    }
}
</script>

<!-- Theme Toggle Script -->
<script>
function toggleTheme() {
    const body = document.getElementById('appBody');
    const icon = document.getElementById('themeIcon');
    
    if (body.classList.contains('dark')) {
        body.classList.remove('dark');
        icon.classList.remove('bi-sun-fill');
        icon.classList.add('bi-moon-fill');
        localStorage.setItem('theme', 'light');
    } else {
        body.classList.add('dark');
        icon.classList.remove('bi-moon-fill');
        icon.classList.add('bi-sun-fill');
        localStorage.setItem('theme', 'dark');
    }
}

// Carregar tema salvo ao iniciar
window.addEventListener('DOMContentLoaded', () => {
    const savedTheme = localStorage.getItem('theme');
    const body = document.getElementById('appBody');
    const icon = document.getElementById('themeIcon');
    
    if (savedTheme === 'dark') {
        body.classList.add('dark');
        icon.classList.remove('bi-moon-fill');
        icon.classList.add('bi-sun-fill');
    }
});
</script>

<!-- PWA Service Worker Registration -->
<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
            .then(registration => {
                console.log('✅ Service Worker registrado:', registration.scope);
            })
            .catch(error => {
                console.log('❌ Erro ao registrar Service Worker:', error);
            });
    });
}
</script>

</div>
</body>
</html>
