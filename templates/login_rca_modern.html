<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Login RCA - DSL Agendamento</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- UX Improvements -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ux-improvements.css') }}">
    <script src="{{ url_for('static', filename='js/ux-enhancements.js') }}"></script>
    
    <style>
        @keyframes animate-fade-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: animate-fade-in 0.5s ease-out;
        }
    </style>
</head>
<body x-data="{ darkMode: false }" :class="{ 'dark': darkMode }">
<div class="min-h-screen bg-gradient-to-br from-slate-50 via-purple-50 to-slate-100 dark:from-slate-900 dark:via-purple-950 dark:to-slate-900 flex items-center justify-center p-4 relative overflow-hidden">
    
    <!-- Background Pattern -->
    <div class="absolute inset-0 opacity-10">
        <div class="absolute inset-0" style="background-image: radial-gradient(circle at 1px 1px, rgb(148 163 184) 1px, transparent 0); background-size: 40px 40px;"></div>
    </div>
    
    <!-- Login Card -->
    <div class="relative z-10 w-full max-w-md" x-data="loginRcaForm()">
        
        <!-- Card Container -->
        <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden animate-fade-in">
            
            <!-- Header with Gradient -->
            <div class="bg-gradient-to-r from-purple-600 to-purple-700 p-8 text-center">
                <div class="w-20 h-20 mx-auto mb-4 bg-white/20 backdrop-blur-sm rounded-2xl flex items-center justify-center">
                    <i class="bi bi-phone text-4xl text-white"></i>
                </div>
                <h1 class="text-3xl font-bold text-white mb-2">Login RCA</h1>
                <p class="text-purple-100">Autenticação via WhatsApp</p>
            </div>
            
            <!-- Form Content -->
            <div class="p-8">
                
                <!-- Success Message -->
                {% if success %}
                <div class="mb-6 bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 rounded-xl p-4 flex items-start gap-3 animate-fade-in">
                    <i class="bi bi-check-circle-fill text-green-500 text-xl flex-shrink-0 mt-0.5"></i>
                    <div>
                        <p class="font-semibold text-green-800 dark:text-green-200">Sucesso!</p>
                        <p class="text-sm text-green-600 dark:text-green-300">{{ success }}</p>
                    </div>
                </div>
                {% endif %}
                
                <!-- Error Message -->
                {% if error %}
                <div class="mb-6 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-xl p-4 flex items-start gap-3 animate-fade-in">
                    <i class="bi bi-exclamation-circle-fill text-red-500 text-xl flex-shrink-0 mt-0.5"></i>
                    <div>
                        <p class="font-semibold text-red-800 dark:text-red-200">Erro</p>
                        <p class="text-sm text-red-600 dark:text-red-300">{{ error }}</p>
                    </div>
                </div>
                {% endif %}
                
                <!-- Step 1: Request Token -->
                <div x-show="!showTokenInput" x-transition>
                    <form method="POST" @submit.prevent="requestToken" class="space-y-6">
                        
                        <!-- Código RCA Field -->
                        <div>
                            <label for="codigo_rca" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">
                                <i class="bi bi-person-badge-fill mr-1"></i> Código RCA
                            </label>
                            <div class="relative">
                                <input 
                                    type="number" 
                                    id="codigo_rca" 
                                    name="codigo_rca" 
                                    x-model="codigoRca"
                                    required
                                    class="w-full px-4 py-3 pl-12 bg-slate-50 dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-700 rounded-xl focus:border-purple-500 focus:ring-4 focus:ring-purple-500/10 outline-none transition-all duration-200 text-slate-900 dark:text-slate-100"
                                    placeholder="Digite seu código RCA"
                                    :class="{ 'border-red-500': errors.codigoRca }"
                                >
                                <i class="bi bi-person-badge absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            </div>
                            <p x-show="errors.codigoRca" x-text="errors.codigoRca" class="mt-1 text-sm text-red-500"></p>
                        </div>
                        
                        <!-- Submit Button -->
                        <button 
                            type="submit" 
                            :disabled="loading"
                            class="w-full bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-700 hover:to-purple-800 text-white font-bold py-4 px-6 rounded-xl shadow-lg shadow-purple-500/30 hover:shadow-xl hover:shadow-purple-500/40 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                        >
                            <span x-show="!loading">
                                <i class="bi bi-whatsapp"></i> Enviar Token via WhatsApp
                            </span>
                            <span x-show="loading" class="flex items-center gap-2">
                                <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                                Enviando...
                            </span>
                        </button>
                    </form>
                </div>
                
                <!-- Step 2: Validate Token -->
                <div x-show="showTokenInput" x-transition class="space-y-6">
                    
                    <!-- Info do RCA -->
                    <div class="bg-purple-50 dark:bg-purple-900/20 border border-purple-200 dark:border-purple-800 rounded-xl p-4">
                        <p class="text-sm text-purple-600 dark:text-purple-300 mb-1">
                            <i class="bi bi-info-circle-fill mr-1"></i> Token enviado para:
                        </p>
                        <p class="font-semibold text-purple-800 dark:text-purple-200" x-text="nomeRca || '{{ nome }}'"></p>
                        <p class="text-xs text-purple-500 dark:text-purple-400 mt-2">
                            Verifique seu WhatsApp e digite o código de 6 dígitos
                        </p>
                    </div>
                    
                    <form method="POST" @submit.prevent="validateToken" class="space-y-6">
                        <input type="hidden" name="codigo_rca" x-model="codigoRca" value="{{ codigo_rca }}">
                        
                        <!-- Token Field -->
                        <div>
                            <label for="token" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">
                                <i class="bi bi-shield-lock-fill mr-1"></i> Código de Verificação
                            </label>
                            <div class="relative">
                                <input 
                                    type="text" 
                                    id="token" 
                                    name="token" 
                                    x-model="token"
                                    required
                                    maxlength="6"
                                    pattern="[0-9]{6}"
                                    class="w-full px-4 py-3 pl-12 bg-slate-50 dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-700 rounded-xl focus:border-purple-500 focus:ring-4 focus:ring-purple-500/10 outline-none transition-all duration-200 text-slate-900 dark:text-slate-100 text-center text-2xl tracking-widest font-mono"
                                    placeholder="000000"
                                    :class="{ 'border-red-500': errors.token }"
                                    @input="token = token.replace(/[^0-9]/g, '')"
                                >
                                <i class="bi bi-shield-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            </div>
                            <p x-show="errors.token" x-text="errors.token" class="mt-1 text-sm text-red-500"></p>
                        </div>
                        
                        <!-- Buttons -->
                        <div class="space-y-3">
                            <button 
                                type="submit" 
                                :disabled="loading"
                                class="w-full bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-700 hover:to-purple-800 text-white font-bold py-4 px-6 rounded-xl shadow-lg shadow-purple-500/30 hover:shadow-xl hover:shadow-purple-500/40 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                            >
                                <span x-show="!loading">
                                    <i class="bi bi-check-circle"></i> Validar Token
                                </span>
                                <span x-show="loading" class="flex items-center gap-2">
                                    <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                                    Validando...
                                </span>
                            </button>
                            
                            <button 
                                type="button"
                                @click="resetForm"
                                class="w-full bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-semibold py-3 px-6 rounded-xl transition-all duration-200"
                            >
                                <i class="bi bi-arrow-left"></i> Voltar
                            </button>
                        </div>
                    </form>
                </div>
                
                <!-- Divider -->
                <div class="relative my-8">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-200 dark:border-slate-700"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400">ou</span>
                    </div>
                </div>
                
                <!-- Admin Login Link -->
                <a 
                    href="/login-modern" 
                    class="block w-full bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-semibold py-4 px-6 rounded-xl transition-all duration-200 text-center"
                >
                    <i class="bi bi-person-circle"></i> Login Administrativo
                </a>
                
            </div>
            
            <!-- Footer -->
            <div class="bg-slate-50 dark:bg-slate-900/50 px-8 py-4 border-t border-slate-200 dark:border-slate-700">
                <div class="flex items-center justify-between text-sm text-slate-500 dark:text-slate-400">
                    <span>© 2026 DSL</span>
                    <button 
                        @click="$root.darkMode = !$root.darkMode"
                        class="p-2 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg transition-colors"
                        title="Alternar tema"
                    >
                        <i :class="$root.darkMode ? 'bi-sun-fill' : 'bi-moon-fill'"></i>
                    </button>
                </div>
            </div>
            
        </div>
        
        <!-- PWA Install Section -->
        <div class="mt-6 text-center space-y-3">
            <p class="text-sm text-slate-600 dark:text-slate-400">
                <i class="bi bi-info-circle"></i> 
                Instale o app para acesso rápido e uso offline
            </p>
            <button 
                @click="installPWA"
                class="inline-flex items-center gap-2 px-6 py-2.5 bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 rounded-lg hover:border-purple-500 hover:text-purple-600 dark:hover:border-purple-500 dark:hover:text-purple-400 transition-all duration-200 text-sm font-medium shadow-sm hover:shadow-md"
            >
                <i class="bi bi-download"></i>
                <span>Instalar Aplicativo</span>
            </button>
        </div>
        
    </div>
</div>

<script>
function loginRcaForm() {
    return {
        codigoRca: '{{ codigo_rca }}' || '',
        token: '',
        nomeRca: '{{ nome }}' || '',
        showTokenInput: {{ 'true' if show_token else 'false' }},
        loading: false,
        errors: {},
        showInstallButton: false,
        deferredPrompt: null,
        
        async requestToken() {
            this.errors = {};
            
            if (!this.codigoRca || this.codigoRca.trim() === '') {
                this.errors.codigoRca = 'Código RCA é obrigatório';
                return;
            }
            
            this.loading = true;
            
            try {
                const formData = new FormData();
                formData.append('codigo_rca', this.codigoRca.trim());
                
                // Adicionar token CSRF
                const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
                formData.append('csrf_token', csrfToken);
                
                const response = await fetch('/login-rca', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    const html = await response.text();
                    
                    if (html.includes('show_token')) {
                        this.showTokenInput = true;
                        
                        const nomeMatch = html.match(/nome=['"]([^'"]+)['"]/);
                        if (nomeMatch) {
                            this.nomeRca = nomeMatch[1];
                        }
                        
                        Swal.fire({
                            icon: 'success',
                            title: 'Token Enviado!',
                            text: 'Verifique seu WhatsApp e digite o código recebido.',
                            confirmButtonColor: '#9333ea',
                            timer: 3000
                        });
                    }
                } else {
                    const html = await response.text();
                    const errorMatch = html.match(/error=['"]([^'"]+)['"]/);
                    const errorMsg = errorMatch ? errorMatch[1] : 'Erro ao solicitar token';
                    
                    Swal.fire({
                        icon: 'error',
                        title: 'Erro',
                        text: errorMsg,
                        confirmButtonColor: '#ef4444'
                    });
                }
            } catch (error) {
                console.error('Erro ao solicitar token:', error);
                
                if (!navigator.onLine) {
                    Swal.fire({
                        icon: 'warning',
                        title: 'Você está offline',
                        text: 'Não é possível solicitar token sem conexão com a internet.',
                        confirmButtonColor: '#f59e0b'
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Erro',
                        text: 'Ocorreu um erro ao solicitar o token. Tente novamente.',
                        confirmButtonColor: '#ef4444'
                    });
                }
            } finally {
                this.loading = false;
            }
        },
        
        async validateToken() {
            this.errors = {};
            
            if (!this.token || this.token.length !== 6) {
                this.errors.token = 'Digite o código de 6 dígitos';
                return;
            }
            
            this.loading = true;
            
            try {
                const formData = new FormData();
                formData.append('codigo_rca', this.codigoRca);
                formData.append('token', this.token);
                
                // Adicionar token CSRF
                const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
                formData.append('csrf_token', csrfToken);
                
                const response = await fetch('/login-rca', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.redirected) {
                    window.location.href = response.url;
                } else if (response.ok) {
                    window.location.href = '/painel';
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Token Inválido',
                        text: 'O token digitado está incorreto ou expirou. Tente novamente.',
                        confirmButtonColor: '#ef4444'
                    });
                    this.token = '';
                }
            } catch (error) {
                console.error('Erro ao validar token:', error);
                
                Swal.fire({
                    icon: 'error',
                    title: 'Erro',
                    text: 'Ocorreu um erro ao validar o token. Tente novamente.',
                    confirmButtonColor: '#ef4444'
                });
            } finally {
                this.loading = false;
            }
        },
        
        async installPWA() {
            const isPWAInstalled = window.matchMedia('(display-mode: standalone)').matches || 
                                   window.navigator.standalone === true;
            
            if (isPWAInstalled) {
                Swal.fire({
                    icon: 'success',
                    title: 'App Já Instalado!',
                    text: 'O DSL Agendamento já está instalado no seu dispositivo.',
                    confirmButtonColor: '#10b981'
                });
                return;
            }
            
            if (this.deferredPrompt) {
                this.deferredPrompt.prompt();
                const { outcome } = await this.deferredPrompt.userChoice;
                
                if (outcome === 'accepted') {
                    Swal.fire({
                        icon: 'success',
                        title: 'App Instalado!',
                        text: 'O DSL Agendamento foi instalado com sucesso.',
                        confirmButtonColor: '#10b981',
                        timer: 3000
                    });
                }
                
                this.deferredPrompt = null;
                return;
            }
            
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
            const isChrome = /Chrome/.test(navigator.userAgent);
            const isEdge = /Edg/.test(navigator.userAgent);
            
            if (isIOS || isSafari) {
                Swal.fire({
                    icon: 'info',
                    title: 'Como Instalar no Safari/iOS',
                    html: `
                        <div class="text-left">
                            <p class="mb-3">Para instalar no Safari:</p>
                            <ol class="list-decimal pl-5 space-y-2">
                                <li>Toque no botão <strong>Compartilhar</strong> (□↑)</li>
                                <li>Role para baixo e toque em <strong>"Adicionar à Tela de Início"</strong></li>
                                <li>Toque em <strong>"Adicionar"</strong></li>
                            </ol>
                        </div>
                    `,
                    confirmButtonText: 'Entendi',
                    confirmButtonColor: '#9333ea'
                });
            } else if (isChrome || isEdge) {
                Swal.fire({
                    icon: 'info',
                    title: 'Como Instalar',
                    html: `
                        <div class="text-left">
                            <p class="mb-3">Para instalar o app:</p>
                            <ol class="list-decimal pl-5 space-y-2">
                                <li>Clique no ícone <strong>⋮</strong> (menu) no canto superior direito</li>
                                <li>Selecione <strong>"Instalar DSL Agendamento"</strong></li>
                                <li>Ou procure o ícone <strong>⊕</strong> na barra de endereço</li>
                            </ol>
                            <p class="mt-3 text-sm text-gray-600">
                                <em>Nota: Aguarde alguns segundos após carregar a página.</em>
                            </p>
                        </div>
                    `,
                    confirmButtonText: 'Entendi',
                    confirmButtonColor: '#9333ea'
                });
            } else {
                Swal.fire({
                    icon: 'info',
                    title: 'Instalação PWA',
                    html: `
                        <div class="text-left">
                            <p class="mb-3">Para instalar o app:</p>
                            <ol class="list-decimal pl-5 space-y-2">
                                <li>Procure o ícone de instalação na barra de endereço</li>
                                <li>Ou acesse o menu do navegador</li>
                                <li>Selecione "Instalar" ou "Adicionar à tela inicial"</li>
                            </ol>
                        </div>
                    `,
                    confirmButtonText: 'Entendi',
                    confirmButtonColor: '#9333ea'
                });
            }
        },
        
        resetForm() {
            this.showTokenInput = false;
            this.token = '';
            this.nomeRca = '';
            this.errors = {};
        },
        
        init() {
            if (this.showTokenInput && this.codigoRca) {
                setTimeout(() => {
                    document.getElementById('token')?.focus();
                }, 100);
            }
            
            // Capturar evento de instalação PWA
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                this.deferredPrompt = e;
                this.showInstallButton = true;
            });
            
            // Verificar se já está instalado
            const isPWAInstalled = window.matchMedia('(display-mode: standalone)').matches || 
                                   window.navigator.standalone === true;
            if (isPWAInstalled) {
                this.showInstallButton = false;
            }
            
            // Esconder botão após instalação
            window.addEventListener('appinstalled', () => {
                this.showInstallButton = false;
                this.deferredPrompt = null;
            });
        }
    }
}
</script>
</div>
</body>
</html>
