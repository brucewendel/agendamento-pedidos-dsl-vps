<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Login RCA - DSL Agendamento</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- UX Improvements -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ux-improvements.css') }}">
    <script src="{{ url_for('static', filename='js/ux-enhancements.js') }}"></script>
    
    <style>
        @keyframes animate-fade-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: animate-fade-in 0.5s ease-out;
        }
    </style>
</head>
<body x-data="{ darkMode: false }" :class="{ 'dark': darkMode }">
<div class="min-h-screen bg-gradient-to-br from-slate-50 via-purple-50 to-slate-100 dark:from-slate-900 dark:via-purple-950 dark:to-slate-900 flex items-center justify-center p-4 relative overflow-hidden">
    
    <!-- Background Pattern -->
    <div class="absolute inset-0 opacity-10">
        <div class="absolute inset-0" style="background-image: radial-gradient(circle at 1px 1px, rgb(148 163 184) 1px, transparent 0); background-size: 40px 40px;"></div>
    </div>
    
    <!-- Login Card -->
    <div class="relative z-10 w-full max-w-md" x-data="loginRcaForm()">
        
        <!-- Card Container -->
        <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden animate-fade-in">
            
            <!-- Header with Gradient -->
            <div class="bg-gradient-to-r from-purple-600 to-purple-700 p-8 text-center">
                <div class="w-20 h-20 mx-auto mb-4 bg-white/20 backdrop-blur-sm rounded-2xl flex items-center justify-center">
                    <i class="bi bi-phone text-4xl text-white"></i>
                </div>
                <h1 class="text-3xl font-bold text-white mb-2">Login RCA</h1>
                <p class="text-purple-100">Acesse com seu código e senha</p>
            </div>
            
            <!-- Form Content -->
            <div class="p-8">
                
                <!-- Success Message -->
                {% if success %}
                <div class="mb-6 bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 rounded-xl p-4 flex items-start gap-3 animate-fade-in">
                    <i class="bi bi-check-circle-fill text-green-500 text-xl flex-shrink-0 mt-0.5"></i>
                    <div>
                        <p class="font-semibold text-green-800 dark:text-green-200">Sucesso!</p>
                        <p class="text-sm text-green-600 dark:text-green-300">{{ success }}</p>
                    </div>
                </div>
                {% endif %}
                
                <!-- Error Message -->
                {% if error %}
                <div class="mb-6 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-xl p-4 flex items-start gap-3 animate-fade-in">
                    <i class="bi bi-exclamation-circle-fill text-red-500 text-xl flex-shrink-0 mt-0.5"></i>
                    <div>
                        <p class="font-semibold text-red-800 dark:text-red-200">Erro</p>
                        <p class="text-sm text-red-600 dark:text-red-300">{{ error }}</p>
                    </div>
                </div>
                {% endif %}
                
                <!-- Login: código + senha -->
                <div>
                    <form method="POST" @submit.prevent="login" class="space-y-6">

                        <!-- Código RCA Field -->
                        <div>
                            <label for="codigo_rca" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">
                                <i class="bi bi-person-badge-fill mr-1"></i> Código RCA
                            </label>
                            <div class="relative">
                                <input
                                    type="number"
                                    id="codigo_rca"
                                    name="codigo_rca"
                                    x-model="codigoRca"
                                    required
                                    autocomplete="username"
                                    class="w-full px-4 py-3 pl-12 bg-slate-50 dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-700 rounded-xl focus:border-purple-500 focus:ring-4 focus:ring-purple-500/10 outline-none transition-all duration-200 text-slate-900 dark:text-slate-100"
                                    placeholder="Digite seu código RCA"
                                    :class="{ 'border-red-500': errors.codigoRca }"
                                >
                                <i class="bi bi-person-badge absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            </div>
                            <p x-show="errors.codigoRca" x-text="errors.codigoRca" class="mt-1 text-sm text-red-500"></p>
                        </div>

                        <!-- Senha Field -->
                        <div>
                            <label for="senha" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">
                                <i class="bi bi-lock-fill mr-1"></i> Senha
                            </label>
                            <div class="relative">
                                <input
                                    :type="mostrarSenha ? 'text' : 'password'"
                                    id="senha"
                                    name="senha"
                                    x-model="senha"
                                    required
                                    autocomplete="current-password"
                                    class="w-full px-4 py-3 pl-12 pr-12 bg-slate-50 dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-700 rounded-xl focus:border-purple-500 focus:ring-4 focus:ring-purple-500/10 outline-none transition-all duration-200 text-slate-900 dark:text-slate-100"
                                    placeholder="Digite sua senha"
                                    :class="{ 'border-red-500': errors.senha }"
                                >
                                <i class="bi bi-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <button type="button" @click="mostrarSenha = !mostrarSenha" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600" title="Mostrar/ocultar senha">
                                    <i :class="mostrarSenha ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                                </button>
                            </div>
                            <p x-show="errors.senha" x-text="errors.senha" class="mt-1 text-sm text-red-500"></p>
                        </div>

                        <!-- Submit Button -->
                        <button
                            type="submit"
                            :disabled="loading"
                            class="w-full bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-700 hover:to-purple-800 text-white font-bold py-4 px-6 rounded-xl shadow-lg shadow-purple-500/30 hover:shadow-xl hover:shadow-purple-500/40 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                        >
                            <span x-show="!loading">
                                <i class="bi bi-box-arrow-in-right"></i> Entrar
                            </span>
                            <span x-show="loading" class="flex items-center gap-2">
                                <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                                Aguarde...
                            </span>
                        </button>

                        <!-- Primeiro acesso / esqueci a senha -->
                        <button
                            type="button"
                            @click="enviarLink()"
                            :disabled="loading"
                            class="w-full text-sm font-semibold text-purple-600 dark:text-purple-300 hover:underline disabled:opacity-50"
                        >
                            <i class="bi bi-whatsapp"></i> Primeiro acesso / Esqueci minha senha
                        </button>
                    </form>
                </div>
                

                <!-- Divider -->
                <div class="relative my-8">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-200 dark:border-slate-700"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400">ou</span>
                    </div>
                </div>
                
                <!-- Admin Login Link -->
                <a 
                    href="/login-modern" 
                    class="block w-full bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-semibold py-4 px-6 rounded-xl transition-all duration-200 text-center"
                >
                    <i class="bi bi-person-circle"></i> Login Administrativo
                </a>
                
            </div>
            
            <!-- Footer -->
            <div class="bg-slate-50 dark:bg-slate-900/50 px-8 py-4 border-t border-slate-200 dark:border-slate-700">
                <div class="flex items-center justify-between text-sm text-slate-500 dark:text-slate-400">
                    <span>© 2026 DSL</span>
                    <button 
                        @click="$root.darkMode = !$root.darkMode"
                        class="p-2 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg transition-colors"
                        title="Alternar tema"
                    >
                        <i :class="$root.darkMode ? 'bi-sun-fill' : 'bi-moon-fill'"></i>
                    </button>
                </div>
            </div>
            
        </div>
        
        <!-- PWA Install Section -->
        
    </div>
</div>

<script>
function loginRcaForm() {
    return {
        codigoRca: '{{ codigo_rca }}' || '',
        senha: '',
        mostrarSenha: false,
        loading: false,
        errors: {},
        showInstallButton: false,
        deferredPrompt: null,
        
        avisoLoginPorSenha() {
            // Aviso único por navegador. O storage pode estar bloqueado: nesse caso mostra sempre.
            const chave = 'aviso_login_senha_v1';
            try {
                if (localStorage.getItem(chave)) return;
            } catch (e) {}

            // Não sobrepor o aviso quando a página já abre com mensagem (ex.: senha acabou de ser criada)
            if (document.querySelector('.animate-fade-in .bi-check-circle-fill, .animate-fade-in .bi-exclamation-circle-fill')) return;

            setTimeout(() => {
                Swal.fire({
                    icon: 'info',
                    title: 'Agora o login é por senha',
                    html: 'O acesso do RCA passou a ser com <b>código e senha</b>, e não mais com o token do WhatsApp.' +
                          '<br><br>Ainda não tem senha? Digite seu código e clique em ' +
                          '<b>"Primeiro acesso / Esqueci minha senha"</b>: enviaremos um link para o seu WhatsApp para você criar a sua.',
                    confirmButtonText: 'Entendi',
                    confirmButtonColor: '#9333ea'
                }).then(() => {
                    try { localStorage.setItem(chave, '1'); } catch (e) {}
                });
            }, 400);
        },

        async post(url, campos) {
            const formData = new FormData();
            Object.entries(campos).forEach(([k, v]) => formData.append(k, v));
            formData.append('csrf_token', document.querySelector('meta[name="csrf-token"]').getAttribute('content'));

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Accept': 'application/json' },
                body: formData
            });
            // 429 do rate limit vem em HTML; não quebrar por isso
            const data = await response.json().catch(() => ({}));
            if (response.status === 429 && !data.message) {
                data.message = 'Muitas tentativas. Aguarde alguns minutos e tente novamente.';
            }
            return { response, data };
        },

        async login() {
            this.errors = {};

            if (!this.codigoRca || String(this.codigoRca).trim() === '') {
                this.errors.codigoRca = 'Código RCA é obrigatório';
                return;
            }
            if (!this.senha) {
                this.errors.senha = 'Informe a senha';
                return;
            }

            this.loading = true;

            try {
                const { response, data } = await this.post('/login-rca', {
                    codigo_rca: String(this.codigoRca).trim(),
                    senha: this.senha
                });

                if (response.ok && data.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Login Realizado!',
                        text: 'Redirecionando...',
                        confirmButtonColor: '#10b981',
                        timer: 1500,
                        showConfirmButton: false
                    });
                    setTimeout(() => {
                        window.location.href = data.redirect || '/painel';
                    }, 1500);
                } else if (data.primeiro_acesso) {
                    // Ainda não tem senha: manda o link de cadastro por WhatsApp
                    this.senha = '';
                    this.loading = false;
                    await this.enviarLink(true);
                } else {
                    this.senha = '';
                    Swal.fire({
                        icon: 'error',
                        title: 'Não foi possível entrar',
                        text: data.message || 'Código ou senha inválidos.',
                        confirmButtonColor: '#ef4444'
                    });
                    setTimeout(() => document.getElementById('senha')?.focus(), 100);
                }
            } catch (error) {
                console.error('Erro no login:', error);
                Swal.fire({
                    icon: navigator.onLine ? 'error' : 'warning',
                    title: navigator.onLine ? 'Erro' : 'Você está offline',
                    text: navigator.onLine ? 'Ocorreu um erro ao entrar. Tente novamente.'
                                           : 'Não é possível entrar sem conexão com a internet.',
                    confirmButtonColor: '#ef4444'
                });
            } finally {
                this.loading = false;
            }
        },

        async enviarLink(primeiroAcesso = false) {
            this.errors = {};

            if (!this.codigoRca || String(this.codigoRca).trim() === '') {
                this.errors.codigoRca = 'Informe o código RCA para receber o link';
                document.getElementById('codigo_rca')?.focus();
                return;
            }

            this.loading = true;

            try {
                const { response, data } = await this.post('/login-rca/esqueci-senha', {
                    codigo_rca: String(this.codigoRca).trim()
                });

                const enviado = response.ok && data.success;
                Swal.fire({
                    icon: enviado ? 'info' : 'error',
                    title: !enviado ? 'Erro' : (primeiroAcesso ? 'Você ainda não tem senha' : 'Verifique seu WhatsApp'),
                    text: !enviado
                        ? (data.message || 'Não foi possível enviar o link. Tente novamente.')
                        : (primeiroAcesso
                            ? 'O login agora é feito com código e senha. Enviamos um link para o seu WhatsApp para você criar a sua. O link vale por 30 minutos.'
                            : data.message),
                    confirmButtonColor: '#9333ea'
                });
            } catch (error) {
                console.error('Erro ao enviar link:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Erro',
                    text: 'Ocorreu um erro ao enviar o link. Tente novamente.',
                    confirmButtonColor: '#ef4444'
                });
            } finally {
                this.loading = false;
            }
        },
        

        async installPWA() {
            const isPWAInstalled = window.matchMedia('(display-mode: standalone)').matches || 
                                   window.navigator.standalone === true;
            
            if (isPWAInstalled) {
                Swal.fire({
                    icon: 'success',
                    title: 'App Já Instalado!',
                    text: 'O DSL Agendamento já está instalado no seu dispositivo.',
                    confirmButtonColor: '#10b981'
                });
                return;
            }
            
            if (this.deferredPrompt) {
                this.deferredPrompt.prompt();
                const { outcome } = await this.deferredPrompt.userChoice;
                
                if (outcome === 'accepted') {
                    Swal.fire({
                        icon: 'success',
                        title: 'App Instalado!',
                        text: 'O DSL Agendamento foi instalado com sucesso.',
                        confirmButtonColor: '#10b981',
                        timer: 3000
                    });
                }
                
                this.deferredPrompt = null;
                return;
            }
            
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
            const isChrome = /Chrome/.test(navigator.userAgent);
            const isEdge = /Edg/.test(navigator.userAgent);
            
            if (isIOS || isSafari) {
                Swal.fire({
                    icon: 'info',
                    title: 'Como Instalar no Safari/iOS',
                    html: `
                        <div class="text-left">
                            <p class="mb-3">Para instalar no Safari:</p>
                            <ol class="list-decimal pl-5 space-y-2">
                                <li>Toque no botão <strong>Compartilhar</strong> (□↑)</li>
                                <li>Role para baixo e toque em <strong>"Adicionar à Tela de Início"</strong></li>
                                <li>Toque em <strong>"Adicionar"</strong></li>
                            </ol>
                        </div>
                    `,
                    confirmButtonText: 'Entendi',
                    confirmButtonColor: '#9333ea'
                });
            } else if (isChrome || isEdge) {
                Swal.fire({
                    icon: 'info',
                    title: 'Como Instalar',
                    html: `
                        <div class="text-left">
                            <p class="mb-3">Para instalar o app:</p>
                            <ol class="list-decimal pl-5 space-y-2">
                                <li>Clique no ícone <strong>⋮</strong> (menu) no canto superior direito</li>
                                <li>Selecione <strong>"Instalar DSL Agendamento"</strong></li>
                                <li>Ou procure o ícone <strong>⊕</strong> na barra de endereço</li>
                            </ol>
                            <p class="mt-3 text-sm text-gray-600">
                                <em>Nota: Aguarde alguns segundos após carregar a página.</em>
                            </p>
                        </div>
                    `,
                    confirmButtonText: 'Entendi',
                    confirmButtonColor: '#9333ea'
                });
            } else {
                Swal.fire({
                    icon: 'info',
                    title: 'Instalação PWA',
                    html: `
                        <div class="text-left">
                            <p class="mb-3">Para instalar o app:</p>
                            <ol class="list-decimal pl-5 space-y-2">
                                <li>Procure o ícone de instalação na barra de endereço</li>
                                <li>Ou acesse o menu do navegador</li>
                                <li>Selecione "Instalar" ou "Adicionar à tela inicial"</li>
                            </ol>
                        </div>
                    `,
                    confirmButtonText: 'Entendi',
                    confirmButtonColor: '#9333ea'
                });
            }
        },
        
        init() {
            this.avisoLoginPorSenha();

            // Capturar evento de instalação PWA
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                this.deferredPrompt = e;
                this.showInstallButton = true;
            });
            
            // Verificar se já está instalado
            const isPWAInstalled = window.matchMedia('(display-mode: standalone)').matches || 
                                   window.navigator.standalone === true;
            if (isPWAInstalled) {
                this.showInstallButton = false;
            }
            
            // Esconder botão após instalação
            window.addEventListener('appinstalled', () => {
                this.showInstallButton = false;
                this.deferredPrompt = null;
            });
        }
    }
}
</script>

<!-- PWA Service Worker Registration e Botão Flutuante -->
<script>
// Capturar evento de instalação (beforeinstallprompt)
let deferredPrompt;
let installButton;

window.addEventListener('beforeinstallprompt', (e) => {
    console.log('🎯 Evento beforeinstallprompt capturado!');
    console.log('✅ PWA pode ser instalado');
    e.preventDefault();
    deferredPrompt = e;
});

// Verificar se já está instalado
window.addEventListener('appinstalled', () => {
    console.log('🎉 PWA instalado com sucesso!');
    hideInstallButton();
});

// Verificar modo standalone (já instalado)
if (window.matchMedia('(display-mode: standalone)').matches) {
    console.log('📱 Rodando em modo STANDALONE (PWA instalado)');
} else {
    console.log('🌐 Rodando no navegador (PWA não instalado)');
    // Mostrar botão de instalação sempre que não estiver em modo standalone
    window.addEventListener('load', () => {
        showInstallButton();
    });
}

// Criar e mostrar botão de instalação
function showInstallButton() {
    // Verificar se já existe
    if (document.getElementById('pwa-install-button')) return;
    
    // Criar botão flutuante
    installButton = document.createElement('button');
    installButton.id = 'pwa-install-button';
    installButton.innerHTML = `
        <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
        </svg>
        <span>Instalar App</span>
    `;
    installButton.className = 'fixed bottom-6 right-6 bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-full shadow-lg flex items-center gap-2 transition-all duration-300 hover:scale-105 z-50 animate-bounce';
    
    // Adicionar evento de clique
    installButton.addEventListener('click', async () => {
        // Se tem prompt disponível (Chrome/Edge) - INSTALAÇÃO AUTOMÁTICA
        if (deferredPrompt) {
            console.log('🚀 Disparando prompt de instalação...');
            
            try {
                // Mostrar o prompt de instalação
                deferredPrompt.prompt();
                
                // Aguardar escolha do usuário
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`👤 Usuário escolheu: ${outcome}`);
                
                if (outcome === 'accepted') {
                    console.log('✅ Usuário aceitou a instalação');
                    hideInstallButton();
                } else {
                    console.log('❌ Usuário recusou a instalação');
                }
                
                // Limpar o prompt
                deferredPrompt = null;
            } catch (error) {
                console.error('Erro ao instalar PWA:', error);
            }
            return;
        }
        
        // Se não tem prompt disponível - Mostrar instruções manuais
        const isAndroid = /Android/i.test(navigator.userAgent);
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        const isChrome = /Chrome/i.test(navigator.userAgent) && !/Edg/i.test(navigator.userAgent);
        const isEdge = /Edg/i.test(navigator.userAgent);
        
        let instructions = '';
        
        if (isAndroid && isChrome) {
            instructions = '<div style="text-align: left; padding: 10px;"><strong>📱 Como instalar no Android (Chrome):</strong><br><br>1. Toque no menu <strong>⋮</strong> (três pontos) no canto superior direito<br>2. Selecione <strong>"Adicionar à tela inicial"</strong> ou <strong>"Instalar app"</strong><br>3. Confirme tocando em <strong>"Adicionar"</strong><br><br>O ícone do app aparecerá na sua tela inicial! 🎉</div>';
        } else if (isIOS) {
            instructions = '<div style="text-align: left; padding: 10px;"><strong>📱 Como instalar no iPhone/iPad (Safari):</strong><br><br>1. Toque no botão <strong>Compartilhar</strong> <svg style="display: inline; width: 16px; height: 16px;" viewBox="0 0 16 16"><path fill="currentColor" d="M8 0l3 3h-2v5H7V3H5l3-3zm3 8v5H5V8H3v7h10V8h-2z"/></svg><br>2. Role para baixo e toque em <strong>"Adicionar à Tela de Início"</strong><br>3. Toque em <strong>"Adicionar"</strong> no canto superior direito<br><br>O ícone do app aparecerá na sua tela inicial! 🎉</div>';
        } else if (isChrome || isEdge) {
            instructions = '<div style="text-align: left; padding: 10px;"><strong>💻 Como instalar no Desktop:</strong><br><br>1. Procure o ícone <strong>⊕</strong> ou <strong>🖥️</strong> na barra de endereço<br>2. Clique nele e selecione <strong>"Instalar"</strong><br><br><strong>OU</strong><br><br>1. Clique no menu <strong>⋮</strong> (três pontos)<br>2. Selecione <strong>"Instalar DSL Agendamento"</strong><br><br>O app será instalado no seu computador! 🎉</div>';
        } else {
            instructions = '<div style="text-align: left; padding: 10px;"><strong>ℹ️ Instalação Manual:</strong><br><br>Para instalar este aplicativo:<br><br>1. Use o navegador <strong>Chrome</strong>, <strong>Edge</strong> ou <strong>Safari</strong><br>2. Procure a opção de <strong>"Adicionar à tela inicial"</strong> ou <strong>"Instalar app"</strong> no menu do navegador<br>3. Siga as instruções na tela<br><br>💡 <strong>Dica:</strong> Acesse via <strong>https://</strong> para instalação automática.</div>';
        }
        
        // Usar SweetAlert2 se disponível, senão usar alert nativo
        if (typeof Swal !== 'undefined') {
            Swal.fire({
                icon: 'info',
                title: 'Como Instalar o App',
                html: instructions,
                confirmButtonText: 'Entendi',
                confirmButtonColor: '#9333ea',
                width: '500px'
            });
        } else {
            alert('Para instalar o app, use o menu do navegador e selecione "Adicionar à tela inicial" ou "Instalar app".');
        }
    });
    
    // Adicionar ao body
    document.body.appendChild(installButton);
    console.log('✅ Botão de instalação exibido');
}

// Esconder botão de instalação
function hideInstallButton() {
    const btn = document.getElementById('pwa-install-button');
    if (btn) {
        btn.remove();
        console.log('🗑️ Botão de instalação removido');
    }
}
</script>
